[package]
name = "Ordust"
version = "0.1.0"
edition = "2024"

[dependencies]
slab = "0.4.12"
thiserror = "2.0.20"
hotpath = { version = "0.24.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[[bench]]
name = "orderbook_benchmarks"
harness = false
